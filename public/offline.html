<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - JK Michaels</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FFF4F1 0%, #FFF 50%, #F6F7F9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 480px;
        }
        .icon {
            width: 120px;
            height: 120px;
            background: #F1F5F9;
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg { width: 56px; height: 56px; color: #94A3B8; }
        h1 { font-size: 28px; color: #1E293B; margin-bottom: 12px; font-weight: 700; }
        p { color: #64748B; font-size: 16px; line-height: 1.6; margin-bottom: 24px; }
        .retry-btn {
            display: inline-block;
            padding: 12px 32px;
            background: #F04000;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .retry-btn:hover { background: #D83200; transform: translateY(-1px); }
        .tips { margin-top: 40px; text-align: left; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .tips h3 { font-size: 14px; color: #475569; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
        .tips ul { list-style: none; }
        .tips li { padding: 8px 0; color: #64748B; font-size: 14px; border-bottom: 1px solid #F1F5F9; }
        .tips li:last-child { border-bottom: none; }
        .tips li::before { content: "- "; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728m12.728 0L5.636 18.364M5.636 5.636l12.728 12.728" />
            </svg>
        </div>
        <h1>You're Offline</h1>
        <p>It seems you've lost your internet connection. Your progress is saved and will sync when you're back online.</p>
        <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
        <div class="tips">
            <h3>While you're offline you can:</h3>
            <ul>
                <li>Review downloaded lessons</li>
                <li>Practice with saved flashcards</li>
                <li>Review your study notes</li>
                <li>Check your saved bookmarks</li>
            </ul>
        </div>
    </div>
</body>
</html>
