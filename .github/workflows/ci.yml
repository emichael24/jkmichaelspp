name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, mysql]
    env:
      CI: 'true'
      JK_TEST_DATABASE_DRIVER: ${{ matrix.database }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: jk_enterprise_test
          MYSQL_USER: jk_test
          MYSQL_PASSWORD: isolated-ci-only
          MYSQL_ROOT_PASSWORD: isolated-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, intl, zip, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json
        run: composer validate --strict

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Install Node dependencies
        run: npm ci

      - name: PHP lint (Pint)
        run: vendor/bin/pint --test

      - name: Build frontend
        run: npm run build

      - name: Test offline privacy and synchronization
        run: npm test

      - name: Run backend tests
        run: php artisan test --without-tty

      - name: Dependency security checks
        run: |
          composer audit --locked
          npm audit --audit-level=moderate
